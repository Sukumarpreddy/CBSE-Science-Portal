<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Study Materials | CBSE Science Portal</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/class.css" />
    <link rel="stylesheet" href="css/materials.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header class="header">
      <div class="logo"><strong>CBSE</strong> Science Portal</div>

      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#classes">Classes</a>
        <a href="index.html#about">About</a>
        <a href="login.html" class="login-btn">Faculty Login</a>
      </nav>
    </header>

    <!-- CHAPTER HEADER -->

    <section class="class-hero">
      <p class="small-title">CBSE SCIENCE</p>

      <h1 id="chapterTitle">Physical World</h1>

      <p id="chapterDescription">Class 11 • Physics</p>
    </section>

    <!-- MATERIALS -->
    <div class="student-material-tools">
      <div class="material-search-box">
        <label for="materialSearch">Search Materials</label>

        <input
          type="text"
          id="materialSearch"
          placeholder="Search notes, questions, assignments..."
        />
      </div>

      <div class="material-filter-box">
        <label for="materialTypeFilter">Material Type</label>

        <select id="materialTypeFilter">
          <option value="all">All Materials</option>
          <option value="notes">Notes</option>
          <option value="important-questions">Important Questions</option>
          <option value="study-material">Study Material</option>
          <option value="assignment">Assignments</option>
          <option value="previous-year">Previous Year Questions</option>
        </select>
      </div>
    </div>

    <div id="materialResultCount" class="material-result-count">
      Loading materials...
    </div>

    <div id="materialContainer" class="material-grid"></div>
    <section class="materials-page">
      <!-- BREADCRUMB -->
      <div class="breadcrumb">
        <a href="index.html">Home</a>
        › Class <span id="breadcrumbClass">11</span> ›
        <span id="subjectTitle">Physics</span> ›
        <span id="breadcrumbChapter">Physical World</span>
      </div>

      <!-- HEADING -->

      <div class="materials-heading">
        <p>STUDY RESOURCES</p>

        <h2>Available Materials</h2>
      </div>

      <!-- MATERIAL CARDS -->

      <div id="materialContainer" class="material-grid"></div>
    </section>

    <!-- FOOTER -->

    <footer>
      <h3>CBSE Science Portal</h3>

      <p>Class 11 & 12 Science Learning Resources</p>

      <p>© 2026 CBSE Science Portal</p>
    </footer>

    <script type="module" src="js/materials.js"></script>
  </body>
</html>
