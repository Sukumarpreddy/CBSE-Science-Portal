<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Manage Materials | CBSE Science Portal</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin-materials.css" />
  </head>

  <body>
    <header class="admin-header">
      <div class="admin-logo">
        <strong>CBSE</strong>
        <span>Science Portal</span>
      </div>

      <nav class="admin-nav">
        <a href="admin-dashboard.html"> Dashboard </a>

        <a href="index.html"> Home </a>

        <button id="logoutBtn" class="admin-logout">Logout</button>
      </nav>
    </header>

    <main class="materials-admin-page">
      <section class="materials-admin-hero">
        <p>ADMINISTRATION</p>

        <h1>Manage Materials</h1>

        <span>
          View, edit and manage all academic resources uploaded to the portal.
        </span>
      </section>

      <section class="materials-admin-container">
        <!-- FILTERS -->

        <div class="filter-section">
          <div class="filter-heading">
            <p>MATERIAL LIBRARY</p>

            <h2>All Study Materials</h2>
          </div>

          <div class="filters">
            <div class="search-box">
              <label for="searchInput"> Search </label>

              <input
                type="text"
                id="searchInput"
                placeholder="Search material..."
              />
            </div>

            <div class="filter-box">
              <label for="classFilter"> Class </label>

              <select id="classFilter">
                <option value="all">All Classes</option>

                <option value="11">Class 11</option>

                <option value="12">Class 12</option>
              </select>
            </div>

            <div class="filter-box">
              <label for="subjectFilter"> Subject </label>

              <select id="subjectFilter">
                <option value="all">All Subjects</option>

                <option value="physics">Physics</option>

                <option value="chemistry">Chemistry</option>

                <option value="mathematics">Mathematics</option>

                <option value="biology">Biology</option>

                <option value="computer-science">Computer Science</option>
              </select>
            </div>
          </div>
        </div>

        <!-- RESULTS -->

        <div id="materialCountText" class="result-count">
          Loading materials...
        </div>

        <div id="adminMaterialContainer" class="admin-material-grid"></div>
      </section>
    </main>

    <footer class="admin-footer">
      <h3>CBSE Science Portal</h3>

      <p>Administration Panel</p>

      <p>© 2026 CBSE Science Portal</p>
    </footer>

    <script type="module" src="js/admin-materials.js"></script>
  </body>
</html>
